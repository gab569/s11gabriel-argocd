apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: s11gabriel-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # Use our custom project — NOT the default project.
  project: s11gabriel

  source:
    repoURL: https://github.com/DEL-ORG/s11gabriel-argocd.git
    targetRevision: main
    path: path/to/kubernetes/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: s11gabriel

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false

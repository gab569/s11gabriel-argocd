apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-deployment
  namespace: s11gabriel

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx
      annotations:
        secret.reloader.stakater.com/reload: "s11gabriel-app-secret"

    spec:
      containers:
        - name: nginx
          image: nginx:1.27
